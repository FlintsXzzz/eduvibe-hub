version: 2.1

jobs:
  deploy-rollback:
    docker:
      - image: cimg/base:stable
    environment:
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      NAMESPACE: "<< pipeline.deploy.namespace >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - run:
          name: Plan rollback
          command: |-
            circleci run release plan deploy-rollback \
              --environment-name=${ENVIRONMENT_NAME} \
              --component-name=${COMPONENT_NAME} \
              --namespace=${NAMESPACE} \
              --target-version=${TARGET_VERSION} \
              --rollback
      - run:
          name: Mark rollback as running
          command: circleci run release update deploy-rollback --status=RUNNING
      - run:
          name: Perform rollback
          command: |
            : "${DEPLOY_COMMAND:?DEPLOY_COMMAND must contain the authenticated deployment command}"
            ${DEPLOY_COMMAND} \
              --environment="${ENVIRONMENT_NAME}" \
              --component="${COMPONENT_NAME}" \
              --namespace="${NAMESPACE}" \
              --version="${TARGET_VERSION}"
      - run:
          name: Update rollback status to successful
          command: circleci run release update deploy-rollback --status=SUCCESS
          when: on_success
      - run:
          name: Update rollback status to failed
          command: circleci run release update deploy-rollback --status=FAILED
          when: on_fail
      - run:
          name: Update rollback status to canceled
          command: circleci run release update deploy-rollback --status=CANCELED
          when: canceled
  cancel-deploy-rollback:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update deploy-rollback \
              --status=CANCELED
  deploy-rollback-release:
    type: release
    plan_name: deploy-rollback
    validation:
      enabled: true

workflows:
  rollback:
    jobs:
      - deploy-rollback
      - deploy-rollback-release:
          requires:
            - deploy-rollback
      - cancel-deploy-rollback:
          requires:
            - deploy-rollback:
              - canceled
